[tools]
# Runtimes and standalone tools
node = "lts"
npm = "latest"
uv = "latest"
zig = "latest"
deno = "latest" # JS runtime yt-dlp uses for YouTube

# Shell tools (prebuilt binaries from the aqua registry)
fzf = "latest"
starship = "latest"
zoxide = "latest"

# Packages installed through another tool above
"npm:markdownlint-cli2" = "latest"
"npm:prettier" = "latest"
"npm:pyright" = "latest"
"pypi:yt-dlp" = { version = "latest", extras = "default" } # installed by uv

[settings]
minimum_release_age = "7d"


